name: Deploy Python Function to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: 'Set up Python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 'Install dependencies'
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install -r requirements.txt
    
    - name: 'Login via Azure CLI'
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_SPN_CREDENTIALS }} # Assumes you have your SPN as a secret

    - name: 'Deploy to Azure Function App'
      uses: azure/functions-action@v1
      with:
        app-name: 'pdf-processor-func-he610x2p' # Your Function App name from Terraform
        package: '.' # Deploy the current directory
        publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}