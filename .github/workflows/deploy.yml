name: Deploy Azure Function and Upload PDFs
on:
  push:
    branches:
      - main

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: 'Set up Python 3.11'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 'Create deployment package'
        shell: bash
        run: |
          mkdir -p staging
          
          cp -r . staging/ || true
          
          rm -rf staging/.git staging/.github staging/.pytest_cache staging/__pycache__ staging/venv staging/.env staging/.venv staging/deployment-package.zip staging/staging
          
          cd staging
          zip -r ../deployment-package.zip . -x "*.git*" "*venv*" "*__pycache__*" "*.pytest_cache*" ".env*" ".github*"
          cd ..
          
          ls -lh deployment-package.zip
          
          # Cleanup staging
          rm -rf staging

      - name: 'Deploy to Azure Function App'
        uses: azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: deployment-package.zip
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true
          remote-build: true

      - name: 'Upload any new PDFs to Blob Storage'
        shell: bash
        run: |
          mkdir -p ./files-to-upload
          echo "Uploading files from ./files-to-upload to pdf-uploads..."
          az storage blob upload-batch \
            --destination pdf-uploads \
            --source ./files-to-upload \
            --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --pattern "*.pdf" \
            --no-progress