name: Deploy Azure Function and Upload PDFs

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: 'Set up Python 3.11'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # This installs all packages into a folder named '.python_packages'
    # which will be zipped and deployed.
    - name: 'Install dependencies for local build'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --target=".python_packages/lib/site-packages"

    - name: 'Log in to Azure'
      uses: azure/login@v1
      with:
        creds: >
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          }

    - name: 'Deploy to Azure Function App'
      uses: azure/functions-action@v1
      with:
        app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
        package: '.' # Zips the directory, including the new .python_packages
        
        scm-do-build-during-deployment: false
        enable-oryx-build: false

    - name: 'Upload any new PDFs to Blob Storage'
      run: |
        # Create the source folder just in case it's not in git
        mkdir -p ./files-to-upload
        
        echo "Uploading files from ./files-to-upload to pdf-uploads..."
        az storage blob upload-batch \
          --destination pdf-uploads \
          --source ./files-to-upload \
          --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
          --pattern "*.pdf" \
          --no-progress