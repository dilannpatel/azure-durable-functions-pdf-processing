name: Deploy Azure Function and Upload PDFs
on:
  push:
    branches:
      - main

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './function_app'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Downloads repo content into the workflow runnner so it can access the code
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

        # Installs python in the build environment
      - name: 'Set up Python 3.11'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 'Create deployment package'
        shell: bash
        run: |
          cd ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          zip -r deployment-package.zip . -x "*.git*" "*venv*" "*__pycache__*" "*.pytest_cache*" ".env*" ".github*"
          ls -lh deployment-package.zip

        # Uploads the deployment package as an artifact to be used in the deploy job
      - name: 'Upload artifact'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/deployment-package.zip
          retention-days: 5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: 'Download artifact'
        uses: actions/download-artifact@v4
        with:
          name: deployment-package
          path: .

      - name: 'Deploy to Azure Function App'
        uses: azure/functions-action@v1
        with:
          app-name: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}
          package: deployment-package.zip
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true

      - name: 'Upload any new PDFs to Blob Storage'
        shell: bash
        run: |
          mkdir -p ./function_app/files-to-upload
          echo "Uploading files from ./function_app/files-to-upload to pdf-uploads..."
          az storage blob upload-batch \
            --destination pdf-uploads \
            --source ./function_app/files-to-upload \
            --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --pattern "*.pdf" \
            --no-progress