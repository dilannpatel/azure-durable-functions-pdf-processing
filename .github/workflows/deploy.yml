name: Deploy Python Function to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: 'Set up Python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 'Install dependencies'
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install -r requirements.txt
    
    # --- THIS IS THE FIX ---
    # We will log in using your Service Principal, just like your other project
    - name: 'Log in to Azure'
      uses: azure/login@v1
      with:
        creds: >
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          }

    # Now that we are logged in, we can deploy
    - name: 'Deploy to Azure Function App'
      uses: azure/functions-action@v1
      with:
        # This must be the exact name from your Terraform output
        app-name: 'pdf-processor-func-he610x2p' 
        package: '.'
        # We DON'T need a publish-profile because we are already logged in