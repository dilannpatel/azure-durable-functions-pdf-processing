name: Deploy Azure Function and Upload PDFs

on:
  push:
    branches:
      - main

env:
  AZURE_FUNCTIONAPP_NAME: ${{ secrets.AZURE_FUNCTIONAPP_NAME }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 'Checkout GitHub Action'
      uses: actions/checkout@v4

    - name: 'Set up Python 3.11'
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 'Install dependencies into package'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --target=".python_packages/lib/site-packages"

    - name: 'Archive function app'
      shell: bash
      run: |
        # Zip the entire directory (code, .python_packages, etc.)
        # The .funcignore file will automatically exclude .venv, .git, etc.
        zip -r deployment.zip .
        
    - name: 'Log in to Azure'
      uses: azure/login@v1
      with:
        creds: >
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          }

    - name: 'Deploy to Azure Function App'
      uses: azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        
        package: 'deployment.zip'
        
        scm-do-build-during-deployment: false
        enable-oryx-build: false

    - name: 'Upload any new PDFs to Blob Storage'
      run: |
        mkdir -p ./files-to-upload
        echo "Uploading files from ./files-to-upload to pdf-uploads..."
        az storage blob upload-batch \
          --destination pdf-uploads \
          --source ./files-to-upload \
          --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
          --pattern "*.pdf" \
          --no-progress